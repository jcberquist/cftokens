name: release
on:
  push:
    branches: [master]
    paths: [Cargo.toml]

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.inspect.outputs.current }}
      previous: ${{ steps.inspect.outputs.previous }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Check for version update
        id: inspect
        run: |-
          set -euo pipefail
          CURRENT_VERSION=$(sed -n 's/^\s*version\s*=\s*"\([^"]*\)".*$/\1/p' Cargo.toml)
          echo "current=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          git checkout -q HEAD^
          PREV_VERSION=$(sed -n 's/^\s*version\s*=\s*"\([^"]*\)".*$/\1/p' Cargo.toml)
          echo "previous=$PREV_VERSION" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    needs: preflight
    if: ${{ needs.preflight.outputs.current != needs.preflight.outputs.previous }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        run: rustup update stable && rustup default stable

      - name: Test
        run: cargo test --locked

  build:
    name: 'build: ${{ matrix.name }}'
    runs-on: ${{ matrix.platform }}
    needs:
      - preflight
      - test
    if: ${{ needs.preflight.outputs.current != needs.preflight.outputs.previous }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            path: target/release/cftokens
            name: cftokens_linux
          - platform: ubuntu-latest
            path: target/x86_64-unknown-linux-musl/release/cftokens
            name: cftokens_linux_musl
            target: --target x86_64-unknown-linux-musl
          - platform: windows-latest
            path: target/release/cftokens.exe
            name: cftokens.exe
          - platform: macos-latest
            path: target/release/cftokens
            name: cftokens_osx_arm
          - platform: macos-latest
            path: target/x86_64-apple-darwin/release/cftokens
            name: cftokens_osx_x86_64
            target: --target x86_64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        run: rustup update stable && rustup default stable

      - name: Install musl tools
        if: ${{ matrix.name == 'cftokens_linux_musl' }}
        run: |-
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: Add target x86_64-apple-darwin
        if: ${{ matrix.name == 'cftokens_osx_x86_64' }}
        run: rustup target add x86_64-apple-darwin

      - name: Build cftokens
        run: cargo build --locked --release ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  osx-universal-binary:
    runs-on: macos-latest
    needs:
      - preflight
      - build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Create OSX universal binary
        run: |-
          lipo -create -output cftokens_osx \
            artifacts/cftokens_osx_arm/cftokens \
            artifacts/cftokens_osx_x86_64/cftokens

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: cftokens_osx
          path: cftokens_osx
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - preflight
      - build
      - osx-universal-binary
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |-
          set -euo pipefail
          mkdir assets
          for dir in artifacts/*; do
            name=$(basename "$dir")
            mv "$dir"/* "assets/$name"
          done
          gh release create "v${{ needs.preflight.outputs.current }}" \
            --repo "${{ github.repository }}" \
            --title "v${{ needs.preflight.outputs.current }}" \
            assets/*
